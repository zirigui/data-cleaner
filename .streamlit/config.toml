[theme]
base = "dark"
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseRadius = "full"
showWidgetBorder = true
primaryColor = "#ff7a59"
backgroundColor = "#071112"
secondaryBackgroundColor = "#0c1a1c"
textColor = "#e6f0ef"
borderColor = "#1b3236"
linkColor = "#2dd4bf"

[server]
maxUploadSize = 200

[client]
toolbarMode = "minimal"
